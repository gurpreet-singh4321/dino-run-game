    #boot-scene {position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px 24px;box-sizing:border-box;background:linear-gradient(180deg,rgba(20,34,53,.70),rgba(18,29,45,.48) 50%,rgba(14,23,36,.72)),url('assets/assets/images/biomes/desert_fossil_canyon.png') center/cover;color:#1f2d42;font-family:Fredoka,Nunito,sans-serif;pointer-events:none;}
    #boot-scene .boot-wrap {width:min(840px,100%);display:flex;align-items:center;gap:24px;}
    #boot-scene .boot-dino {flex:4;display:flex;align-items:center;justify-content:center;overflow:visible;}

<body>
  <div id="boot-scene" role="status" aria-label="Loading Dino Run Epochs">
    <div class="boot-wrap">
      <div class="boot-dino">
        <div id="boot-dino-stage" class="boot-dino-stage">
          <div id="boot-ledge" class="boot-ledge"></div>
          <img id="boot-dino-img" src="assets/assets/images/boot_dino.png" alt="" width="240" height="280">
        </div>
      </div>
      <div class="boot-panel">
        <div class="boot-crest"><h1>Dino Run <span>Epochs</span></h1></div>
        <div class="boot-card">
          <p>Adventure awaits.</p>
          <div class="boot-track"><div class="boot-track-fill"></div></div>
          <div class="boot-status">Waking up Dino…</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function applyCachedBootStage() {
      try {
        const raw = window.localStorage && window.localStorage.getItem('dino_boot_stage_v2');
        if (!raw) return;
        const stage = JSON.parse(raw);
        const container = document.getElementById('boot-dino-stage');
        const img = document.getElementById('boot-dino-img');
        const ledge = document.getElementById('boot-ledge');
        if (container && stage.hill) {
          const hill = document.createElement('img');
          hill.id = 'boot-hill-img';
          hill.className = 'boot-hill-img';
          hill.alt = '';
          hill.src = stage.hill;
          hill.style.display = 'block';
          container.insertBefore(hill, img || null);
          if (ledge) ledge.style.display = 'none';
        }
        if (img && stage.open) {
          img.src = stage.open;
          img.classList.add('boot-stage-cached');
          if (stage.blink) {
            const preloadBlink = new Image();
            preloadBlink.src = stage.blink;
            const blinkCycle = function() {
              if (!document.getElementById('boot-scene')) return;
              img.src = stage.blink;
              setTimeout(function() {
                if (!document.getElementById('boot-scene')) return;
                img.src = stage.open;
              }, 145);
              setTimeout(blinkCycle, 3100);
            };
            setTimeout(blinkCycle, 1350);
          }
        }
      } catch (_) {}
    })();
    window.saveDinoBootStage = function(payload) {
      try {
        if (window.localStorage && payload) {
          window.localStorage.setItem('dino_boot_stage_v2', payload);
        }
      } catch (_) {}
    };
    window.finishDinoBoot = function() {
      const scene=document.getElementById('boot-scene');
      if(scene) scene.remove();
    };
  </script>

  <script>
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'PAUSE_GAME') {
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', code: 'KeyP', keyCode: 80, bubbles: true }));
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', keyCode: 27, bubbles: true }));
      }
    });

    // The web-server debug target can expose its entrypoint without running it
    // when no debugging extension is attached. Wait for normal boot first,
    // then guard both the fallback and any late DWDS call with the same latch.
    (function debugBootFallback() {
      let checks = 0;
      const timer = setInterval(function() {
        if (document.querySelector('flutter-view') || ++checks > 80) {
          clearInterval(timer);
          return;
        }
        if (checks < 40 || typeof window.$dartRunMain !== 'function') return;
        const original = window.$dartRunMain;
        let started = false;
        window.$dartRunMain = function() {
          if (started) return;
          started = true;
          return original.apply(window, arguments);
        };
        clearInterval(timer);
        window.$dartRunMain();
      }, 100);
    })();

  </script>
