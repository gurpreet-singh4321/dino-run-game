    #boot-scene {position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px 24px;box-sizing:border-box;background:linear-gradient(180deg,rgba(20,34,53,.70),rgba(18,29,45,.48) 50%,rgba(14,23,36,.72)),url('assets/assets/images/biomes/desert_fossil_canyon.png') center/cover;color:#1f2d42;font-family:Fredoka,Nunito,sans-serif;transition:opacity .28s ease;pointer-events:none;}
    #boot-scene .boot-wrap {width:min(840px,100%);display:flex;align-items:center;gap:24px;}

    #boot-scene .boot-crest {padding:9px 24px 14px;border-radius:14px;background:linear-gradient(180deg,#2b3e59,#152132);border:2px solid #0c121a;box-shadow:0 5px 0 #0a1018,inset 0 0 0 1.4px rgba(216,174,94,.85);text-align:center;}
    #boot-scene h1 {margin:0;font-size:clamp(26px,3.6vw,36px);line-height:1.15;font-weight:700;color:#fff8e6;text-shadow:0 2px 4px rgba(11,17,26,.85);}
    #boot-scene h1 span {color:#ffcb55;}
    #boot-scene .boot-card {width:100%;box-sizing:border-box;padding:14px 18px 16px;border-radius:22px;background:linear-gradient(180deg,#fffcf3,#f3e7cd);border:2.2px solid #5d462b;box-shadow:0 4px 0 #43311d,0 8px 16px rgba(16,24,36,.35),inset 0 0 0 1.8px #d5b070;text-align:center;}
    #boot-scene .boot-card p {margin:0 0 12px;font-size:17px;font-weight:700;color:#1f2d42;}
    .boot-track {height:10px;padding:2.5px;background:#1d2c42;border:1.6px solid #c2974d;border-radius:10px;overflow:hidden;}

  <div id="boot-scene" role="status" aria-label="Loading Dino Run Epochs">

      <div class="boot-panel">

        <div class="boot-card">
          <p>Adventure awaits.</p>
          <div class="boot-track"><div class="boot-track-fill"></div></div>
          <div class="boot-status">Waking up Dino…</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.finishDinoBoot = function() {
      const scene=document.getElementById('boot-scene');
      if(scene) scene.remove();
    };

  <script>
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'PAUSE_GAME') {
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'p', code: 'KeyP', keyCode: 80, bubbles: true }));
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', keyCode: 27, bubbles: true }));
      }
    });

    // The web-server debug target can expose its entrypoint without running it
    // when no debugging extension is attached. Wait for normal boot first,
    // then guard both the fallback and any late DWDS call with the same latch.
    (function debugBootFallback() {
      let checks = 0;
      const timer = setInterval(function() {
        if (document.querySelector('flutter-view') || ++checks > 80) {
          clearInterval(timer);
          return;
        }
        if (checks < 40 || typeof window.$dartRunMain !== 'function') return;
        const original = window.$dartRunMain;
        let started = false;
        window.$dartRunMain = function() {
          if (started) return;
          started = true;
          return original.apply(window, arguments);
        };
        clearInterval(timer);
        window.$dartRunMain();
      }, 100);
    })();

  </script>
